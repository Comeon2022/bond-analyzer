name = "israel-macro-rates-dashboard"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://bond-analyzer-av2.pages.dev"

[observability]
enabled = true

[triggers]
crons = ["30 16 * * 1-5"]

[[d1_databases]]
binding = "DB"
database_name = "macro-rates-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
